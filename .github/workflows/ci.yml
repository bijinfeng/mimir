name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# 新提交进来时取消上一次未跑完的任务，避免排队
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 构建需要一组可校验的占位值；PG 测试另用 TEST_DATABASE_URL 显式选择方言
  DATABASE_URL: postgres://mimir:mimir@127.0.0.1:5544/mimir_test
  AUTH_SECRET: ci-only-secret-not-for-production
  DATA_DIR: ./data
  VAULT_DIR: ./data/vault
  RAW_DIR: ./data/raw

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        # 必须用带 pgvector 的镜像：迁移会建 vector 扩展和 GIN 索引，
        # 用官方 postgres 镜像会在迁移阶段就失败
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: mimir
          POSTGRES_PASSWORD: mimir
          POSTGRES_DB: mimir_test
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U mimir -d mimir_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 路径类环境变量相对仓库根解析，测试也需要这两个目录存在
      - run: mkdir -p data/vault data/raw data/.test/vault data/.test/raw

      # PDFium's native insert-text path embeds installed sfnt CJK fonts.
      # Keep real Chinese wrapping/save assertions; the runner's Latin fonts are insufficient.
      - name: Install CJK fonts for native PDF tests
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-match 'Noto Sans CJK SC'

      # 与本地完成门一致：含样式守卫和根目录的桌面进程测试
      - run: pnpm check
        env:
          # Office and server both execute native/WASM suites on the same runner.
          # Preserve test budgets while avoiding competing workspace processes.
          PNPM_CONFIG_WORKSPACE_CONCURRENCY: 1
      # @mimir/shared 以源码发布，编译责任在使用方；类型检查不代替构建
      - run: pnpm build
      # 与桌面/fnOS 相同的拼装脚本：这里只做结构验证，不跑容器
      - name: Build portable runtime artifact
        run: node scripts/build-runtime.mjs --out "$RUNNER_TEMP/mimir-runtime" --web apps/web/dist --skip-build
      - name: Verify runtime manifest
        run: |
          node -e "const m=require(process.env.RUNNER_TEMP+'/mimir-runtime/manifest.json'); if (m.name!=='mimir-runtime'||!m.required.includes('dist/runtime/cli.js')||!m.required.includes('web/dist/index.html')) throw new Error('runtime manifest incomplete'); if (m.platform!=='linux'||m.arch!=='x64') throw new Error('runtime manifest platform mismatch'); console.log(JSON.stringify({version:m.productVersion,protocol:m.protocolVersion,shellAbi:m.shellAbi,files:m.required.length}))"
      # 同一套服务端断言在 PG 上复跑，globalSetup 还会从空库执行正式迁移
      - run: pnpm --filter @mimir/server test
        env:
          TEST_DATABASE_URL: postgres://mimir:mimir@127.0.0.1:5544/mimir_test

      # 隔离 MinIO 检验 S3 SDK 真正的读写、中文 CopySource 与 1000+ 对象翻页。
      - name: S3 compatibility smoke test
        env:
          MIMIR_S3_TEST_ENDPOINT: http://127.0.0.1:19000
          MIMIR_S3_TEST_ACCESS_KEY: mimirtest
          MIMIR_S3_TEST_SECRET_KEY: mimirtest-secret-only
        run: |
          # MinIO removed anonymous community images. Use the official historical
          # linux-amd64 RELEASE.2025-09-07T16-13-09Z asset, pinned by SHA256.
          fixture="$(mktemp -d "$RUNNER_TEMP/mimir-minio-test.XXXXXX")"
          minio_pid=''
          cleanup() {
            if [[ -n "$minio_pid" ]]; then
              kill "$minio_pid" 2>/dev/null || true
              for attempt in $(seq 1 50); do
                if ! kill -0 "$minio_pid" 2>/dev/null; then break; fi
                sleep 0.1
              done
              if kill -0 "$minio_pid" 2>/dev/null; then kill -KILL "$minio_pid" 2>/dev/null || true; fi
              wait "$minio_pid" 2>/dev/null || true
            fi
            rm -rf "$fixture"
          }
          trap cleanup EXIT
          curl --fail --location --silent --show-error --retry 3 --max-time 180 \
            -H 'Accept: application/octet-stream' \
            https://api.github.com/repos/minio/minio/releases/assets/404655976 \
            -o "$fixture/minio"
          echo "7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f  $fixture/minio" | sha256sum --check
          chmod +x "$fixture/minio"
          "$fixture/minio" --version
          MINIO_ROOT_USER="$MIMIR_S3_TEST_ACCESS_KEY" \
            MINIO_ROOT_PASSWORD="$MIMIR_S3_TEST_SECRET_KEY" \
            "$fixture/minio" server "$fixture/data" \
            --address 127.0.0.1:19000 --console-address 127.0.0.1:19001 \
            > "$fixture/server.log" 2>&1 &
          minio_pid=$!
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:19000/minio/health/live > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:19000/minio/health/live > /dev/null
          pnpm --filter @mimir/plugin-storage exec vitest run src/s3.integration.test.ts
