# 桌面端打包配置（D-046 / D-103）。
#
# 结构：dist/**（主进程、preload **与渲染进程**三段都进 asar——渲染进程自
# D-103 起是本包 electron-vite 的入口，不再从 apps/web 拷产物）。
# 服务端运行所需的三件套（dist + drizzle-sqlite + 生产 node_modules）
# 由 afterPack 钩子（scripts/after-pack.mjs）拷进 Resources——
# 不用 extraResources 是因为它会跳过点开头的目录（dist/node_modules/.pnpm
# 会被静默丢掉，运行时报模块找不到，见钩子内的说明）。
#
# server 的 node_modules 来自 `pnpm --filter @mimir/server deploy --prod`
# 的产物（apps/desktop/server-deploy，由根的 desktop:build 先生成）。
# better-sqlite3 v13 自带 N-API 预编译（跨 Node/Electron 通用），无需重编。
#
# 图标来自 `resources/icon.icns|ico|png`（生成脚本 `scripts/make-icons.ts`，
# 见那里的说明与 D-091）。三个文件**提交进仓库**——生成它们需要一条画图
# 链路，而打包的人不该为此装任何东西。
appId: app.mimir.desktop
# 打包产物的名字（应用名 / 安装包名 / macOS 菜单栏）。与界面品牌一致
productName: mimir
# 可执行文件的名字。**必须显式给**：不给时 electron-builder 用 package.json
# 的 `name`（`@mimir/desktop`）拼成 `@mimirdesktop`——而 Linux 的 WM_CLASS
# 与窗口列表正是按可执行文件名推导的，于是任务栏上显示的是那个东西
# （实测打包出来确实是 `@mimirdesktop`，用户当场就会看到）
executableName: mimir
directories:
  output: release
files:
  # 三段产物 + 选择页（D-103）：选择页自 D-103 起是渲染进程的第二个入口，
  # 产物就在 dist/renderer/setup.html，所以不再需要单独列 ui/**
  - dist/**
asarUnpack:
  - '**/*.node'
npmRebuild: false
afterPack: scripts/after-pack.mjs
artifactName: mimir-${version}-${os}-${arch}.${ext}
publish:
  provider: github
  owner: bijinfeng
  repo: mimir
  releaseType: release
# package.mjs overrides this immutable marker for supported automatic builds.
extraMetadata:
  desktopUpdateMode: manual
mac:
  icon: resources/icon.icns
  category: public.app-category.productivity
  # 不签不公证：ad-hoc 签名在 afterPack 里做（否则 macOS 直接 SIGKILL 秒退）。
  # 正式分发需要开发者证书 + 公证（identity + notarize），本机构建仅自用。
  identity: null
  notarize: false
  target:
    - dmg
    - zip
# Linux 明确只构建 AppImage；不使用 builder 默认的 AppImage + Snap 双目标，
# 否则同一份安装包要额外下载 Snap 模板并打两次（实测本机）。
# Windows 图标先配好；尚未在 Windows 宿主验证其安装包。
linux:
  icon: resources/icon.png
  category: Office
  target:
    - AppImage
win:
  icon: resources/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  # Keep the assisted installer's Finish-page launch action for explicit updates.
  # A first /S install still does not launch unless --force-run is also passed.
  runAfterFinish: true
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
