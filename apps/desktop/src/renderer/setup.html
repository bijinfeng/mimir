<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>mimir · 选择使用方式</title>
    <!--
      首帧外观。与 index.html 完全同源（读同一个 key、同样的取值收敛、
      同样兜住 localStorage 抛错）——两边必须一起改。

      这一页尤其需要它：它是**首次启动看到的第一个画面**，而 React 挂载前
      浏览器会先按默认（白色）画一帧。深色用户看到的就是一下白闪。
    -->
    <script>
      ;(function () {
        var appearance = null
        try {
          var stored = localStorage.getItem('mimir.appearance')
          if (stored === 'light' || stored === 'dark') appearance = stored
        } catch (error) {
          // 隐私模式下 localStorage 读取会抛错，当作「没存过」
        }
        if (!appearance) {
          appearance =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        }
        var root = document.documentElement
        root.dataset.theme = appearance
        root.style.colorScheme = appearance
        root.style.background = appearance === 'dark' ? '#18191a' : '#ffffff'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./setup.tsx"></script>
  </body>
</html>
