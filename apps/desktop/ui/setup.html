<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>mimir — 选择使用方式</title>
    <!--
      首次启动的选择页（D-100）。

      三条设计约束，每一条都对应一种真实失败：

      1. **自包含**：不引任何外部资源（字体、图标、脚本）。它要在「本地宿主还
         没起来」「云端地址还没填」的时刻可靠地显示出来——那时任何外部依赖
         都可能加载失败，而这是用户唯一能改回正确设置的地方。
      2. **不依赖本地宿主**：云端用户不必先起一个本地服务才能看到它；
         宿主起不来时它也还在。
      3. **自带窗口控件**：主进程用的是 frame: false（Windows / Linux）与
         titleBarStyle: hidden（macOS，保留系统红绿灯），所以这条页面自己要
         给出拖动区与最小化/关闭按钮——桌面壳里所有自绘页面共同的前提。
         漏掉的话在 Linux/Windows 上窗口既不能拖也不能关。

      配色跟系统走（prefers-color-scheme），且与产品主题的浅/深底色一致：
      加载瞬间不闪一个不对的方向（与主进程的 backgroundColor 是同一件事）。
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f6f8;
        --card: #ffffff;
        --text: #1f2329;
        --text-2: #5c6570;
        --text-3: #68707c;
        --border: #d9dde3;
        --primary: #1677ff;
        --primary-text: #ffffff;
        --hover: #f0f2f5;
        --focus: #4b93dc;
        --danger-text: #c5221f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0c0e;
          --card: #141618;
          --text: rgba(255, 255, 255, 0.92);
          --text-2: rgba(255, 255, 255, 0.68);
          --text-3: rgba(255, 255, 255, 0.52);
          --border: #3c4044;
          --primary: #1668dc;
          --hover: #1e2022;
          --focus: #4b93dc;
          --danger-text: #f0777a;
        }
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
          'Microsoft YaHei', sans-serif;
        font-size: 14px;
        display: flex;
        flex-direction: column;
      }

      /* ── 标题栏：拖动区 + 窗口控件（frame: false 的配套）────────────── */
      .titlebar {
        height: 44px;
        flex: none;
        display: flex;
        align-items: center;
        padding: 0 0 0 16px;
        -webkit-app-region: drag;
      }
      body[data-platform='darwin'] .titlebar {
        padding-left: 84px; /* 给系统红绿灯让位 */
      }
      .titlebar .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        letter-spacing: 0.06em;
      }
      /* 品牌标记另存一份最小实现：这个页面不能 import 应用的组件 */
      .titlebar svg {
        color: var(--primary);
      }
      .titlebar .spacer {
        flex: 1;
      }
      .controls {
        display: flex;
        height: 100%;
        -webkit-app-region: no-drag;
      }
      .controls button {
        width: 46px;
        height: 44px;
        border: 0;
        background: transparent;
        color: var(--text-2);
        cursor: default;
        display: grid;
        place-items: center;
      }
      .controls button:hover {
        background: var(--hover);
        color: var(--text);
      }
      .controls button.close:hover {
        background: #c5221f;
        color: #fff;
      }
      /* macOS 保留系统红绿灯：右边不再画三枚 */
      body[data-platform='darwin'] .controls {
        display: none;
      }

      /* ── 内容 ──────────────────────────────────────────── */
      main {
        flex: 1;
        min-height: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        overflow: auto;
        -webkit-app-region: no-drag;
      }
      .card {
        width: 620px;
        max-width: 100%;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 28px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 20px;
        font-weight: 600;
      }
      .lead {
        margin: 0 0 22px;
        color: var(--text-2);
        line-height: 1.6;
      }
      .options {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      @media (max-width: 560px) {
        .options {
          grid-template-columns: 1fr;
        }
      }
      .option {
        text-align: left;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px;
        color: inherit;
        font: inherit;
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          background-color 0.15s ease;
      }
      .option:hover {
        border-color: var(--focus);
      }
      .option[aria-pressed='true'] {
        border-color: var(--primary);
        background: color-mix(in srgb, var(--primary) 8%, transparent);
      }
      .option:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      .option .name {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .option .desc {
        color: var(--text-2);
        line-height: 1.6;
        font-size: 13px;
      }
      .option .tag {
        margin-left: auto;
        font-size: 12px;
        font-weight: 500;
        color: var(--text-3);
      }

      .field {
        margin-top: 16px;
        display: none;
      }
      .field[data-visible='true'] {
        display: block;
      }
      label {
        display: block;
        margin-bottom: 6px;
        color: var(--text-2);
      }
      input[type='url'] {
        width: 100%;
        height: 36px;
        padding: 0 11px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card);
        color: var(--text);
        font: inherit;
      }
      input[type='url']:focus {
        outline: 2px solid var(--focus);
        outline-offset: -1px;
        border-color: var(--focus);
      }
      .hint {
        margin: 6px 0 0;
        color: var(--text-3);
        font-size: 13px;
      }

      .row {
        margin-top: 22px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      button.primary {
        height: 36px;
        padding: 0 18px;
        border: 0;
        border-radius: 8px;
        background: var(--primary);
        color: var(--primary-text);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button.primary:disabled {
        opacity: 0.55;
        cursor: default;
      }
      button.primary:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      /* 「返回，不改」：只在「从已激活的模式进来」时出现。它是取消动作，
         所以是次级形态——不抢「开始使用」的位置 */
      button.quiet {
        height: 36px;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: transparent;
        color: var(--text-2);
        font: inherit;
        cursor: pointer;
      }
      button.quiet:hover {
        color: var(--text);
        border-color: var(--focus);
      }
      button.quiet:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      .status {
        min-height: 20px;
        color: var(--text-2);
      }
      .status[data-kind='error'] {
        color: var(--danger-text);
      }
      .footnote {
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        color: var(--text-3);
        font-size: 13px;
        line-height: 1.6;
      }
      /* 默认隐藏，`data-visible='true'` 才显示。**不要只写 `.field` 那条**——
         漏了这一条时首启页会多出一行「已在其他方式下使用过？」，
         而那行讲的是「已经选过一次」的情况（实测截图发现） */
      .footnote {
        display: none;
      }
      .footnote[data-visible='true'] {
        display: block;
      }
      .switch-link {
        background: none;
        border: 0;
        padding: 0;
        color: var(--text-2);
        font: inherit;
        text-decoration: underline;
        cursor: pointer;
      }
      .switch-link:hover {
        color: var(--text);
      }
      .switch-link:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <header class="titlebar">
      <span class="brand">
        <svg width="18" height="18" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path
            fill="currentColor"
            fill-rule="evenodd"
            clip-rule="evenodd"
            d="M11 7.4c-3.1 1.5-4.9 4-4.9 7.3v6a2.1 2.1 0 0 0 2.1 2.1h3.2a2.1 2.1 0 0 0 2.1-2.1v-4a2.1 2.1 0 0 0-2.1-2.1H9.2c.2-1.7 1.1-2.9 2.7-3.7zM9.7 17.4a2 2 0 1 0 0 4 2 2 0 1 0 0-4zM21 7.4c-3.1 1.5-4.9 4-4.9 7.3v6a2.1 2.1 0 0 0 2.1 2.1h3.2a2.1 2.1 0 0 0 2.1-2.1v-4a2.1 2.1 0 0 0-2.1-2.1h-2.2c.2-1.7 1.1-2.9 2.7-3.7zM19.7 17.4a2 2 0 1 0 0 4 2 2 0 1 0 0-4z"
          />
        </svg>
        <b>mimir</b>
      </span>
      <span class="spacer"></span>
      <div class="controls">
        <button type="button" id="min" aria-label="最小化" title="最小化">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <path d="M0 5h10" stroke="currentColor" stroke-width="1" />
          </svg>
        </button>
        <button type="button" class="close" id="close" aria-label="关闭" title="关闭">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1" />
          </svg>
        </button>
      </div>
    </header>

    <main>
      <div class="card">
        <h1 id="title">选择使用方式</h1>
        <p class="lead" id="lead">
          mimir 可以完全离线地在这台电脑上使用，也可以连上你自己的服务器。
          这个选择随时可以在客户端的设置 › 客户端里改。
        </p>

        <div class="options" role="group" aria-labelledby="title">
          <button type="button" class="option" id="opt-local" aria-pressed="true">
            <span class="name">
              本地使用
              <span class="tag">不需要登录</span>
            </span>
            <span class="desc"> 数据全部存在这台电脑上，不联网也能用。适合一个人、一台机器。 </span>
          </button>
          <button type="button" class="option" id="opt-cloud" aria-pressed="false">
            <span class="name">
              连接服务器
              <span class="tag">需要登录</span>
            </span>
            <span class="desc">
              数据存在你自己的 mimir 服务器上。适合多台设备访问同一份知识库。
            </span>
          </button>
        </div>

        <div class="field" id="field-cloud" data-visible="false">
          <label for="cloud-url">服务器地址</label>
          <input
            type="url"
            id="cloud-url"
            placeholder="https://mimir.example.com"
            autocomplete="off"
            spellcheck="false"
          />
          <p class="hint">填部署 mimir 时对外提供服务的那个地址。</p>
        </div>

        <div class="row">
          <button type="button" class="primary" id="confirm">开始使用</button>
          <button type="button" class="quiet" id="back" hidden>返回，不改</button>
          <span class="status" id="status" role="status" aria-live="polite"></span>
        </div>

        <div class="footnote" id="footnote" data-visible="false">
          已在其他方式下使用过？<button type="button" class="switch-link" id="switch">更改</button>
        </div>
      </div>
    </main>

    <script>
      /**
       * 选择页的逻辑（D-100）。刻意保持朴素：没有框架、没有构建、没有模块。
       *
       * 它有三个入口形态：
       *  1. 首次启动（`mode.get()` 返回 null）——标题「选择使用方式」
       *  2. 从已选模式里点「更换使用方式」——预选当前模式，允许取消
       *  3. 云端连不上时的兜底——同上，但语气是「换一个」
       *
       * 不做探活的展示细节：地址是否可达由主进程校验（它才知道失败原因），
       * 这里只把结果如实显示出来。
       */
      const bridge = window.mimirDesktop

      const els = {
        title: document.getElementById('title'),
        lead: document.getElementById('lead'),
        local: document.getElementById('opt-local'),
        cloud: document.getElementById('opt-cloud'),
        field: document.getElementById('field-cloud'),
        url: document.getElementById('cloud-url'),
        confirm: document.getElementById('confirm'),
        back: document.getElementById('back'),
        status: document.getElementById('status'),
        footnote: document.getElementById('footnote'),
        switch: document.getElementById('switch'),
      }

      /** null = 首次启动（还没有配置）；否则是当前配置 */
      let current = null
      /** 用户当前选择。首屏默认本地——它是「不需要任何准备就能开始」的那一个 */
      let choice = 'local'

      function render() {
        els.local.setAttribute('aria-pressed', String(choice === 'local'))
        els.cloud.setAttribute('aria-pressed', String(choice === 'cloud'))
        els.field.dataset.visible = String(choice === 'cloud')
        els.confirm.disabled = choice === 'cloud' && !els.url.value.trim()
        if (choice === 'cloud' && document.activeElement !== els.url) els.url.focus()
      }

      function setStatus(kind, text) {
        els.status.dataset.kind = kind
        els.status.textContent = text
      }

      els.local.addEventListener('click', () => {
        choice = 'local'
        setStatus('', '')
        render()
      })
      els.cloud.addEventListener('click', () => {
        choice = 'cloud'
        setStatus('', '')
        render()
      })
      els.url.addEventListener('input', render)
      els.url.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') void commit()
      })

      async function commit() {
        if (!bridge || !bridge.mode) {
          setStatus('error', '这个窗口不是桌面客户端，无法切换使用方式')
          return
        }
        els.confirm.disabled = true
        setStatus('', choice === 'local' ? '正在准备本地知识库…' : '正在连接服务器…')

        const payload =
          choice === 'local' ? { mode: 'local' } : { mode: 'cloud', cloudUrl: els.url.value }

        let result
        try {
          result = await bridge.mode.choose(payload)
        } catch (error) {
          result = { ok: false, message: String(error) }
        }

        if (!result || !result.ok) {
          els.confirm.disabled = false
          setStatus('error', (result && result.message) || '切换失败')
          return
        }

        setStatus('', '正在打开…')
        bridge.mode.activate()
      }

      els.confirm.addEventListener('click', () => void commit())

      /**
       * 「返回，不改」：把窗口带回**当前已经生效的模式**。
       *
       * 它走 `activate()` 而不是自己拼地址——宿主那边会顺带把本机令牌重新
       * 注入（本地模式下这是必须的一步），地址归一化也只有一处。
       */
      els.back.addEventListener('click', () => {
        setStatus('', '正在返回…')
        bridge?.mode.activate()
      })

      els.switch.addEventListener('click', () => {
        setStatus('', '')
        els.title.textContent = '切换使用方式'
        els.lead.textContent = '换一种方式使用 mimir。本地数据不会因为切换而删除，随时可以切回来。'
        els.footnote.dataset.visible = 'false'
        render()
      })

      document.getElementById('min').addEventListener('click', () => bridge?.window.minimize())
      document.getElementById('close').addEventListener('click', () => bridge?.window.close())
      document.body.dataset.platform = bridge?.window.platform ?? ''

      async function init() {
        if (!bridge || !bridge.mode) {
          // 在普通浏览器里打开这个文件（或 preload 没跑起来）时，如实说清楚，
          // 而不是让按钮点了没反应
          setStatus('error', '这个窗口不是桌面客户端')
          els.confirm.disabled = true
          return
        }

        current = await bridge.mode.get()
        if (current) {
          choice = current.mode
          if (current.mode === 'cloud') els.url.value = current.cloudUrl
          els.title.textContent = '切换使用方式'
          els.lead.textContent =
            '换一种方式使用 mimir。本地数据不会因为切换而删除，随时可以切回来。'
          els.footnote.dataset.visible = 'true'
          // 已经有生效中的模式 → 可以什么都不改地回去
          els.back.hidden = false
        } else {
          els.footnote.dataset.visible = 'false'
        }
        render()
      }

      void init()
    </script>
  </body>
</html>
