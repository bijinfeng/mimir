<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      SVG favicon：可缩放，且内部用 prefers-color-scheme 适配深色标签栏。
      不需要 .ico 兜底——所有当前浏览器都支持 SVG favicon（Safari 14+/2020 起）。
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#1677ff" />
    <title>mimir</title>
    <!--
      首帧外观。**放在这里而不是 React 里**：React 挂载前浏览器会先按默认
      （白色）画一帧，深色用户看到的就是一下白闪——而那一帧的时长正好是
      bundle 解析加首次渲染，在慢机器上很明显。

      这段脚本的判断与 `src/theme/appearance.ts` 完全同源：读同一个 key、
      同样的取值收敛、同样兜住 localStorage 抛错。两边必须一起改，
      所以键名都带着「另一处在哪」的注释。

      它写 `data-theme`、`color-scheme` 与一条兜底背景——后者只覆盖
      「脚本跑完到样式注入之间」那一段，稳态色值仍由 React 那侧给
      （`styles/global.ts` 的 `html` 规则）。
    -->
    <script>
      ;(function () {
        var appearance = null
        try {
          var stored = localStorage.getItem('mimir.appearance')
          if (stored === 'light' || stored === 'dark') appearance = stored
        } catch (error) {
          // 隐私模式下 localStorage 读取会抛错，当作「没存过」
        }
        if (!appearance) {
          appearance =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        }
        var root = document.documentElement
        root.dataset.theme = appearance
        root.style.colorScheme = appearance
        root.style.background = appearance === 'dark' ? '#0b0c0e' : '#f5f6f8'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
