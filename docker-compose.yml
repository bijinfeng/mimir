# 开发：只起数据库，前后端在本机跑（热更新快）
# 生产：用 profiles 打开 app 服务，见下方注释
services:
  postgres:
    # pgvector 官方镜像：自带 vector + pg_trgm。
    # 备选 paradedb/paradedb:v0.22.6-pg17 内置 BM25 + Lindera 中文分词，
    # 中文检索更强，但 Community 版是 AGPL-3.0。见 .trellis/spec/project/research.md §5.4。
    image: pgvector/pgvector:pg17
    container_name: mimir-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-mimir}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mimir}
      POSTGRES_DB: ${DB_NAME:-mimir}
    # 只绑本机：数据库不应该被外部直接访问
    ports:
      - '127.0.0.1:${DB_PORT:-5544}:5432'
    volumes:
      - mimir-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-mimir} -d ${DB_NAME:-mimir}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    # 生产专用：docker compose --profile prod up -d --build
    # 开发时不启动它，前端跑 vite，后端跑 tsx watch。
    profiles: ['prod']
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mimir-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # 容器内走服务名，不是 127.0.0.1
      DATABASE_URL: postgres://${DB_USER:-mimir}:${DB_PASSWORD:-mimir}@postgres:5432/${DB_NAME:-mimir}
      AUTH_SECRET: ${AUTH_SECRET:?生产部署必须设置 AUTH_SECRET，用 openssl rand -base64 32 生成}
      # 唯一的数据根：vault/ · raw/ · avatars/ 是它下面的三个前缀。
      # 不要再按目录逐个传环境变量——漏一个不报错，数据会静静地落到容器
      # 可写层（头像就是这么丢过一次的，见 .trellis/spec/project/research.md §10.10）。
      DATA_DIR: /data
      # 用量统计按哪个时区切天。容器默认 UTC——不设它的话「今天」按 UTC 算，
      # 凌晨 0 点到 8 点的消耗会落到前一天（热力图整体左移一格，且不报错）。
      # 也可以在设置页「统计」分区改，界面覆盖优先于这里。
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - '${APP_PORT:-3000}:3000'
    volumes:
      # vault 与 raw 是真相，必须持久化到宿主机
      - ./data:/data
    restart: unless-stopped

volumes:
  mimir-pgdata:
