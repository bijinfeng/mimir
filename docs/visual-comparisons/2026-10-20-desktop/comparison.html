    const scene = document.querySelector('#scene')
    const entries = [...data.pairs, ...data.supplements]
    let mode = 'compare'
    function render() {
      const item = entries.find((x) => x.key === scene.value) || entries[0]
      scene.value = item.key
      const paired = data.pairs.some((x) => x.key === item.key)
      document.querySelector('#caption').textContent = paired
        ? item.theme +
          ' · ' +
          item.platform +
          ' · 视口' +
          item.viewport.join('×') +
          ' · ' +
          item.steps
        : item.caption
      for (const variant of ['before', 'after']) {
        const figure = document.getElementById(variant)
        figure.classList.toggle(
          'hidden',
          (variant === 'before' && !paired) || (mode !== 'compare' && mode !== variant),
        )
        if (item[variant]) {
          figure.querySelector('img').src = item[variant]
          figure.querySelector('a').href = item[variant]
        }
      }
      document.querySelector('.views').classList.toggle('single', mode !== 'compare' || !paired)
      document.querySelectorAll('[data-mode]').forEach((b) => {
        b.setAttribute('aria-pressed', String(b.dataset.mode === mode))
        b.disabled = !paired && b.dataset.mode === 'before'
      })
      history.replaceState(null, '', '#' + item.key)
    }
    scene.addEventListener('change', () => {
      if (!data.pairs.some((x) => x.key === scene.value)) mode = 'after'
      render()
    })
    document.querySelectorAll('[data-mode]').forEach((b) =>
      b.addEventListener('click', () => {
        mode = b.dataset.mode
        render()
      }),
    )
    scene.value = location.hash.slice(1) || entries[0].key
