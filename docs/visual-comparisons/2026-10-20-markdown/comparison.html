      const byId = (id) => document.getElementById(id)
      let current
      function choose(key) {
        current = scenes.find((s) => s.key === key) || scenes[0]
        if (!current) return
        history.replaceState(null, '', '#' + encodeURIComponent(current.key))
        byId('description').textContent = current.label + ' · ' + current.ids.join(' / ')
        byId('demo').href =
          'demo/dist/after/index.html?scene=' +
          encodeURIComponent(current.scene) +
          '&prepare=1&theme=' +
          current.theme +
          '&width=' +
          current.fixture.width +
          '&height=' +
          current.fixture.height
        for (const side of ['before', 'after']) {
          const host = byId(side)
          host.replaceChildren()
          host.classList.remove('missing')
          const data = current[side]
          if (data) {
            const img = new Image()
            img.src = data.file
            img.alt = current.label + ' ' + (side === 'before' ? '打磨前' : '打磨后')
            host.append(img)
          } else {
            host.textContent = current.detail
              ? '此项请打开实际组件 Demo；覆盖与未验证边界见 acceptance.md 和 coverage.json。'
              : '真实产品补充证据，未配对'
            host.classList.add('missing')
          }
        }
        for (const button of byId('navigation').children)
          button.setAttribute('aria-current', String(button.dataset.key === current.key))
      }
      function list() {
        const q = byId('filter').value.toLowerCase()
        byId('navigation').replaceChildren()
        for (const s of scenes.filter((s) =>
          (s.label + s.key + s.ids.join(' ')).toLowerCase().includes(q),
        )) {
          const b = document.createElement('button')
          b.dataset.key = s.key
          b.textContent = s.label
          const small = document.createElement('small')
          small.textContent = s.ids.join(' · ')
          b.append(small)
          b.onclick = () => choose(s.key)
          b.setAttribute('aria-current', String(current?.key === s.key))
          byId('navigation').append(b)
        }
      }
      byId('filter').oninput = list
      byId('mode').onchange = () => (byId('screens').dataset.mode = byId('mode').value)
      byId('original').onchange = () =>
        (byId('screens').dataset.original = String(byId('original').checked))
      list()
      choose(decodeURIComponent(location.hash.slice(1)))
