<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小程序入口页 · 前后</title>
    <style>
      body {
        margin: 0;
        background: #f5f6f5;
        color: #242824;
        font:
          14px/1.6 system-ui,
          'PingFang SC',
          sans-serif;
      }
      main {
        max-width: 980px;
        margin: auto;
        padding: 32px 24px 48px;
      }
      h1 {
        font-size: 26px;
        margin: 0 0 8px;
      }
      p {
        color: #555f57;
      }
      .pair {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 28px;
      }
      figure {
        margin: 0;
      }
      figcaption {
        font-weight: 600;
        margin-bottom: 8px;
      }
      img {
        width: 100%;
        border: 1px solid #d8ded8;
        background: #fff;
      }
      @media (max-width: 720px) {
        .pair {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>小程序入口页 · 真实模拟器前后</h1>
      <p>微信开发者工具 2.01.2510260，iPhone 12/13 Pro，页面区 390px；同内容、同尺寸。</p>
      <section class="pair">
        <figure>
          <figcaption>连接门 · 修改前</figcaption>
          <img src="before/gate.png" />
        </figure>
        <figure>
          <figcaption>连接门 · 修改后</figcaption>
          <img src="after/gate.png" />
        </figure>
      </section>
      <section class="pair">
        <figure>
          <figcaption>登录 · 修改前</figcaption>
          <img src="before/login.png" />
        </figure>
        <figure>
          <figcaption>登录 · 修改后</figcaption>
          <img src="after/login.png" />
        </figure>
      </section>
      <p>其余 5 个业务页面待下一轮；未执行真实登录。</p>
    </main>
  </body>
</html>
