<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小程序业务页 · 前后</title>
    <style>
      body {
        margin: 0;
        background: #f5f6f5;
        color: #242824;
        font:
          14px/1.6 system-ui,
          'PingFang SC',
          sans-serif;
      }
      main {
        max-width: 1040px;
        margin: auto;
        padding: 32px 24px 56px;
      }
      h1 {
        font-size: 26px;
        margin: 0 0 8px;
      }
      p {
        color: #555f57;
      }
      .pair {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 28px;
      }
      figure {
        margin: 0;
      }
      figcaption {
        font-weight: 600;
        margin-bottom: 8px;
      }
      img {
        width: 100%;
        border: 1px solid #d8ded8;
        background: #fff;
      }
      @media (max-width: 760px) {
        .pair {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>小程序业务页 · 真实服务端前后</h1>
      <p>
        Taro H5 1:1，390×844；同账号、同一天的真实文档。表单/选择器/空态/加载/头像已改用 NutUI。
      </p>
      <section class="pair">
        <figure>
          <figcaption>问答 · 390×844 · 修改前</figcaption>
          <img src="before/chat.png" />
        </figure>
        <figure>
          <figcaption>问答 · 390×844 · 修改后</figcaption>
          <img src="after/chat.png" />
        </figure>
      </section>
      <section class="pair">
        <figure>
          <figcaption>知识库 · 390×844 · 修改前</figcaption>
          <img src="before/library.png" />
        </figure>
        <figure>
          <figcaption>知识库 · 390×844 · 修改后</figcaption>
          <img src="after/library.png" />
        </figure>
      </section>
      <section class="pair">
        <figure>
          <figcaption>我的 · 390×844 · 修改前</figcaption>
          <img src="before/account.png" />
        </figure>
        <figure>
          <figcaption>我的 · 390×844 · 修改后</figcaption>
          <img src="after/account.png" />
        </figure>
      </section>
      <section class="pair">
        <figure>
          <figcaption>收集链接 · 390×844 · 修改前</figcaption>
          <img src="before/capture.png" />
        </figure>
        <figure>
          <figcaption>收集链接 · 390×844 · 修改后</figcaption>
          <img src="after/capture.png" />
        </figure>
      </section>
      <section class="pair">
        <figure>
          <figcaption>阅读 · 390×844 · 修改前</figcaption>
          <img src="before/reader.png" />
        </figure>
        <figure>
          <figcaption>阅读 · 390×844 · 修改后</figcaption>
          <img src="after/reader.png" />
        </figure>
      </section>
      <section class="pair">
        <figure>
          <figcaption>编辑笔记 · 390×844 · 修改前</figcaption>
          <img src="before/editor.png" />
        </figure>
        <figure>
          <figcaption>编辑笔记 · 390×844 · 修改后</figcaption>
          <img src="after/editor.png" />
        </figure>
      </section>
    </main>
  </body>
</html>
