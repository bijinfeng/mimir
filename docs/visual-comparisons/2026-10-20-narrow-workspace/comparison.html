<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>窄屏工作区 · 前后</title>
    <style>
      body {
        margin: 0;
        background: #f5f6f5;
        color: #242824;
        font:
          14px/1.6 system-ui,
          'PingFang SC',
          sans-serif;
      }
      main {
        max-width: 920px;
        margin: auto;
        padding: 32px 24px 48px;
      }
      h1 {
        font-size: 26px;
        margin: 0 0 8px;
      }
      p {
        color: #555f57;
      }
      .frames {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 24px;
      }
      figure {
        margin: 0;
      }
      figcaption {
        font-weight: 600;
        margin-bottom: 8px;
      }
      img {
        width: 100%;
        border: 1px solid #d8ded8;
        background: #fff;
      }
      @media (max-width: 720px) {
        .frames {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>窄屏工作区 · 390×844</h1>
      <p>
        笔记分类标签：前态 216/205 溢出 11px，后态 205/205，四档完整可见。文档、对话、设置见 context
        目录。
      </p>
      <div class="frames">
        <figure>
          <figcaption>修改前</figcaption>
          <img src="before/note-tabs.png" alt="修改前" />
        </figure>
        <figure>
          <figcaption>修改后</figcaption>
          <img src="after/note-tabs.png" alt="修改后" />
        </figure>
      </div>
    </main>
  </body>
</html>
