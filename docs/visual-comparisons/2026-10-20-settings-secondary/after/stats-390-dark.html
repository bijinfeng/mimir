      首帧外观。**放在这里而不是 React 里**：React 挂载前浏览器会先按默认

      bundle 解析加首次渲染，在慢机器上很明显。

      这段脚本的判断与 `src/theme/appearance.ts` 完全同源：读同一个 key、
