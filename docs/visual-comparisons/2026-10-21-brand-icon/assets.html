<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta

  ><style>
    :root {
      color-scheme: light dark;
    }
    body {
      font: 15px/1.6 system-ui;
      margin: 0;
      padding: 32px;
      background: light-dark(#f7f8f8, #18191a);
      color: light-dark(#262626, #e6e7e8);
    }
    main {
      max-width: 1100px;
      margin: auto;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    section {
      border: 1px solid light-dark(#ddd, #454b47);
      padding: 24px;
      border-radius: 8px;
      min-width: 0;
    }
    h1 {
      font-size: 24px;
    }
    h2 {
      font-size: 20px;
    }
    h3 {
      font-size: 14px;
      margin: 24px 0 12px;
    }
    .row {
      display: flex;
      gap: 24px;
      align-items: center;
    }
    img {
      max-width: 100%;
      height: auto;
    }
    .circle {
      width: 256px;
      height: 256px;
      border-radius: 50%;
      overflow: hidden;
    }
    @media (max-width: 650px) {
      body {
        padding: 16px;
      }
      .grid {
        grid-template-columns: 1fr;
      }
      .row {
        gap: 12px;
      }
    }
  </style>
