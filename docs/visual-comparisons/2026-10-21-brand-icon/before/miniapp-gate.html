      .taro-navigation-bar-show {
        display: flex;
        background: white;
        position: sticky;
        z-index: 500;
        top: 0;
        padding-bottom: 8px;

        justify-content: center;
        align-items: center;

        display: none;
      }

        display: flex;
        height: 24px;
      }

        display: none;
        animation: loading 2s linear infinite;
      }

      .taro-navigation-bar-title-wrap

        display: flex;
      }

        font-size: 24px;
        height: 24px;
        line-height: 24px;
        max-width: 100px;
        white-space: nowrap;
        overflow: hidden;
        line-height: 24px;
        text-overflow: ellipsis;
      }

      @keyframes loading {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes loading {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

        height: 24px;

        display: flex;
        left: 8px;
        position: absolute;
        width: 24px;
        height: 24px;
      }
    </style>
    <style>
      body {

        overflow: hidden;
      }
      .taro_router > .taro_page {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: #fff;
        transform: translate(100%, 0);
        transition: transform 300ms;
        z-index: 0;
      }

      .taro_router > .taro_page.taro_tabbar_page,
      .taro_router > .taro_page.taro_page_show.taro_page_stationed {
        transform: none;
        transition: none;
      }

      .taro_router > .taro_page.taro_page_show {
        transform: translate(0, 0);
      }
    </style>
