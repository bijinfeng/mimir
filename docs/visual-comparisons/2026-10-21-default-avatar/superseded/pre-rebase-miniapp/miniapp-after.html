<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <style>
      :root,
      page {
        --nut-icon-height: 16px;
        --nut-icon-width: 16px;
        --nut-icon-line-height: 16px;
        --animate-duration: 1s;
        --animate-delay: 0s;
      }
      .nut-icon {
        width: var(--nut-icon-width, 16px);
        height: var(--nut-icon-height, 16px);
        font-size: var(--nut-icon-width, 16px);
        line-height: var(--nut-icon-line-height, 16px);
        text-align: right;
        display: inline-block;
        position: relative;
      }
      .nut-icon-img {
        width: var(--nut-icon-width);
        height: var(--nut-icon-height);
        object-fit: contain;
      }
      .nut-icon-loading,
      .nut-icon-loading1,
      .nut-icon-Loading,
      .nut-icon-Loading1 {
        animation: 1s linear 0s infinite normal none running rotation;
        display: inline-block;
      }
      .nut-icon-am-infinite {
        animation-iteration-count: infinite;
        animation-direction: alternate;
      }
      .nut-icon-am-jump {
        animation-name: nutJumpOne;
        animation-duration: var(--animate-duration);
        animation-timing-function: ease;
        animation-delay: var(--animate-delay);
      }
      .nut-icon-am-jump.nut-icon-am-infinite {
        animation-name: nutJump;
      }
      .nut-icon-am-rotate {
        animation-name: rotation;
        animation-duration: var(--animate-duration);
        animation-timing-function: linear;
        animation-delay: var(--animate-delay);
      }
      .nut-icon-am-rotate.nut-icon-am-infinite {
        animation-direction: normal;
      }
      .nut-icon-am-blink {
        animation-name: nutBlink;
        animation-duration: var(--animate-duration);
        animation-timing-function: linear;
        animation-delay: var(--animate-delay);
      }
      .nut-icon-am-breathe {
        animation-name: nutBreathe;
        animation-duration: var(--animate-duration);
        animation-timing-function: ease-in-out;
        animation-delay: var(--animate-delay);
      }
      .nut-icon-am-flash {
        animation-name: nutFlash;
        animation-duration: var(--animate-duration);
        animation-timing-function: ease-in-out;
        animation-delay: var(--animate-delay);
      }
      .nut-icon-am-bounce {
        animation-name: nutBounce;
        animation-duration: var(--animate-duration);
        animation-timing-function: ease-in-out;
        animation-delay: var(--animate-delay);
      }
      .nut-icon-am-bounce.nut-icon-am-infinite {
        animation-direction: normal;
      }
      .nut-icon-am-shake {
        animation-name: nutShake;
        animation-duration: var(--animate-duration);
        animation-timing-function: ease-in-out;
        animation-delay: var(--animate-delay);
      }
      @keyframes rotation {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      @keyframes nutJump {
        100% {
          transform: scale3d(0.8, 1, 0.9) translateY(-10px);
        }
      }
      @keyframes nutJumpOne {
        50% {
          transform: scale3d(0.8, 1, 0.9) translateY(-10px);
        }
        100% {
          transform: scaleZ(1) translateY(0px);
        }
      }
      @keyframes nutBlink {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }
      @keyframes nutBreathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.2);
        }
      }
      @keyframes nutFlash {
        0%,
        50%,
        100% {
          opacity: 1;
        }
        25%,
        75% {
          opacity: 0;
        }
      }
      @keyframes nutBounce {
        0%,
        20%,
        53%,
        100% {
          animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
          transform: translateZ(0px);
        }
        40%,
        43% {
          animation-timing-function: cubic-bezier(0.755, 0.05, 0.855, 0.06);
          transform: translateY(-30px) scaleY(1.1);
        }
        70% {
          animation-timing-function: cubic-bezier(0.755, 0.05, 0.855, 0.06);
          transform: translateY(-15px) scaleY(1.05);
        }
        80% {
          transition-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
          transform: translateZ(0px) scaleY(0.95);
        }
        90% {
          transform: translateY(-4px) scaleY(1.02);
        }
      }
      @keyframes nutShake {
        0% {
          transform: translate(0px);
        }
        6.5% {
          transform: translate(-6px) rotateY(-9deg);
        }
        18.5% {
          transform: translate(5px) rotateY(7deg);
        }
        31.5% {
          transform: translate(-3px) rotateY(-5deg);
        }
        43.5% {
          transform: translate(2px) rotateY(3deg);
        }
        50% {
          transform: translate(0px);
        }
      }
      page,
      :root {
        --nutui-color-primary: #00834d;
        --nutui-color-primary-stop-1: #00834d;
        --nutui-color-primary-stop-2: #00834d;

        --nutui-button-square-border-radius: 6px;

        font-size: 15px;
      }
      .nut-input {
        align-items: center;
        height: 44px;
        min-height: 44px;
        padding: 0px 12px;
      }
      .nut-input-main {
        min-height: 0px;
      }
      .nut-input input,
      .nut-textarea textarea {
        color: rgb(38, 38, 38);
        font-size: 15px;
      }
      .nut-textarea {
        padding: 8px 12px;
      }
      .weui-tabbar__icon:not([src]) {
        display: none;
      }
      .weui-tabbar__item {
        padding-top: 8px;
        padding-bottom: calc(6px + env(safe-area-inset-bottom));
      }
      .chat-empty {
        justify-content: center;
        align-items: center;
        height: 100%;
        min-height: 220px;
        display: flex;
      }
      .chat-empty .empty {
        text-align: center;
        padding: 24px 8px;
      }
      .profile-card {
        background: rgb(247, 248, 248);
        border: 1px solid rgb(232, 232, 232);
        border-radius: 8px;
        align-items: center;
        gap: 12px;
        margin-top: 16px;
        padding: 16px;
        display: flex;
      }
      .profile-avatar {
        color: rgb(255, 255, 255);
        text-align: center;
        background: rgb(0, 131, 77);
        border-radius: 50%;
        flex: 0 0 auto;
        width: 48px;
        height: 48px;
        font-size: 20px;
        font-weight: 600;
        line-height: 48px;
      }
      .profile-text {
        flex: 1 1 0%;
        min-width: 0px;
      }
      .profile-name {
        font-size: 16px;
        font-weight: 600;
        display: block;
      }
      .profile-email {
        color: rgb(107, 107, 107);
        word-break: break-all;
        margin-top: 2px;
        font-size: 12px;
        display: block;
      }
      .profile-status {
        color: rgb(107, 107, 107);
        flex: 0 0 auto;
        font-size: 12px;
      }
      .capture-submit .nut-button {
        width: 100%;
      }
      .capture-submit .muted {
        text-align: center;
      }
      .composer > .nut-segmented {
        background: rgb(242, 243, 242);
        border-radius: 6px;
        width: 100%;
        margin-bottom: 8px;
        padding: 3px;
        display: flex;
      }
      .composer > .nut-segmented .nut-segmented-item {
        color: rgb(89, 89, 89);
        border-radius: 4px;
        flex: 1 1 0%;
        justify-content: center;
        align-items: center;
        min-height: 36px;
        font-size: 14px;
        display: flex;
      }
      .composer > .nut-segmented .nut-segmented-item-active {
        color: rgb(38, 38, 38);
        background: rgb(255, 255, 255);
        font-weight: 500;
        box-shadow: rgba(0, 0, 0, 0.06) 0px 1px 2px;
      }
      .nut-avatar.profile-avatar {
        font-size: 20px;
        font-weight: 600;
        color: rgb(255, 255, 255) !important;
        background: rgb(0, 131, 77) !important;
      }
      .nut-avatar.profile-avatar .nut-avatar-text {
        color: rgb(255, 255, 255) !important;
      }
      :root,
      page {
        --nut-scale-f: 1;
        --nut-scale-font: var(--nut-scale-f, 1);
        --nut-scale-icon: var(--nut-scale-f, 1);
        --nut-icon-height: calc(16px * var(--nut-scale-icon, var(--nut-scale-f, 1))) !important;
        --nut-icon-width: calc(16px * var(--nut-scale-icon, var(--nut-scale-f, 1))) !important;
        --nut-icon-line-height: calc(
          16px * var(--nut-scale-icon, var(--nut-scale-f, 1))
        ) !important;
      }
      .nut-avatar {
        width: var(--nutui-avatar-normal-width, calc(40px * var(--nut-scale-f, 1)));
        height: var(--nutui-avatar-normal-height, calc(40px * var(--nut-scale-f, 1)));
        flex: 0 0 auto;
        justify-content: center;
        align-items: center;
        display: flex;
        position: relative;
      }
      .nut-avatar-round {
        border-radius: calc(999px * var(--nut-scale-f, 1));
        overflow: hidden;
      }
      .nut-avatar-square {
        border-radius: var(--nutui-avatar-square, calc(5px * var(--nut-scale-f, 1)));
      }
      .nut-avatar-first-child {
        margin-left: 0px;
        margin-right: 0px;
      }
      .nut-avatar-img {
        background-position: 50% center;
        background-repeat: no-repeat;
        background-size: 100% 100%;
        flex-shrink: 0;
        width: 100%;
        height: 100%;
      }
      .nut-avatar-icon {
        background-size: 100% 100%;
      }
      .nut-avatar-text {
        justify-content: center;
        align-items: center;
        display: flex;
      }
      .nut-avatar-large,
      .nut-avatar-large-img,
      .nut-avatar-large-icon,
      .nut-avatar-large-text {
        width: var(--nutui-avatar-large-width, calc(60px * var(--nut-scale-f, 1)));
        height: var(--nutui-avatar-large-height, calc(60px * var(--nut-scale-f, 1)));
      }
      .nut-avatar-small,
      .nut-avatar-small-text {
        width: var(--nutui-avatar-small-width, calc(32px * var(--nut-scale-f, 1)));
        height: var(--nutui-avatar-small-height, calc(32px * var(--nut-scale-f, 1)));
      }
    </style>
