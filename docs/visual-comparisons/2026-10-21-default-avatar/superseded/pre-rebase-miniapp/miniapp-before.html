<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <style>
      :root,
      page {
        --nut-icon-height: 16px;
        --nut-icon-width: 16px;
        --nut-icon-line-height: 16px;
        --animate-duration: 1s;
        --animate-delay: 0s;
      }
      .nut-icon {
        width: var(--nut-icon-width, 16px);
        height: var(--nut-icon-height, 16px);
        font-size: var(--nut-icon-width, 16px);
        line-height: var(--nut-icon-line-height, 16px);
        text-align: right;
        display: inline-block;
        position: relative;
      }
      .nut-icon-img {
        width: var(--nut-icon-width);
        height: var(--nut-icon-height);
        object-fit: contain;
      }
      .nut-icon-loading,
      .nut-icon-loading1,
      .nut-icon-Loading,
      .nut-icon-Loading1 {
        animation: 1s linear 0s infinite normal none running rotation;
        display: inline-block;
      }
      .nut-icon-am-infinite {
        animation-iteration-count: infinite;
        animation-direction: alternate;
      }
      .nut-icon-am-jump {
        animation-name: nutJumpOne;
        animation-duration: var(--animate-duration);
        animation-timing-function: ease;
        animation-delay: var(--animate-delay);
      }
      .nut-icon-am-jump.nut-icon-am-infinite {
        animation-name: nutJump;
      }
      .nut-icon-am-rotate {
        animation-name: rotation;
        animation-duration: var(--animate-duration);
        animation-timing-function: linear;
        animation-delay: var(--animate-delay);
      }
      .nut-icon-am-rotate.nut-icon-am-infinite {
        animation-direction: normal;
      }
      .nut-icon-am-blink {
        animation-name: nutBlink;
        animation-duration: var(--animate-duration);
        animation-timing-function: linear;
        animation-delay: var(--animate-delay);
      }
      .nut-icon-am-breathe {
        animation-name: nutBreathe;
        animation-duration: var(--animate-duration);
        animation-timing-function: ease-in-out;
        animation-delay: var(--animate-delay);
      }
      .nut-icon-am-flash {
        animation-name: nutFlash;
        animation-duration: var(--animate-duration);
        animation-timing-function: ease-in-out;
        animation-delay: var(--animate-delay);
      }
      .nut-icon-am-bounce {
        animation-name: nutBounce;
        animation-duration: var(--animate-duration);
        animation-timing-function: ease-in-out;
        animation-delay: var(--animate-delay);
      }
      .nut-icon-am-bounce.nut-icon-am-infinite {
        animation-direction: normal;
      }
      .nut-icon-am-shake {
        animation-name: nutShake;
        animation-duration: var(--animate-duration);
        animation-timing-function: ease-in-out;
        animation-delay: var(--animate-delay);
      }
      @keyframes rotation {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      @keyframes nutJump {
        100% {
          transform: scale3d(0.8, 1, 0.9) translateY(-10px);
        }
      }
      @keyframes nutJumpOne {
        50% {
          transform: scale3d(0.8, 1, 0.9) translateY(-10px);
        }
        100% {
          transform: scaleZ(1) translateY(0px);
        }
      }
      @keyframes nutBlink {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }
      @keyframes nutBreathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.2);
        }
      }
      @keyframes nutFlash {
        0%,
        50%,
        100% {
          opacity: 1;
        }
        25%,
        75% {
          opacity: 0;
        }
      }
      @keyframes nutBounce {
        0%,
        20%,
        53%,
        100% {
          animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
          transform: translateZ(0px);
        }
        40%,
        43% {
          animation-timing-function: cubic-bezier(0.755, 0.05, 0.855, 0.06);
          transform: translateY(-30px) scaleY(1.1);
        }
        70% {
          animation-timing-function: cubic-bezier(0.755, 0.05, 0.855, 0.06);
          transform: translateY(-15px) scaleY(1.05);
        }
        80% {
          transition-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
          transform: translateZ(0px) scaleY(0.95);
        }
        90% {
          transform: translateY(-4px) scaleY(1.02);
        }
      }
      @keyframes nutShake {
        0% {
          transform: translate(0px);
        }
        6.5% {
          transform: translate(-6px) rotateY(-9deg);
        }
        18.5% {
          transform: translate(5px) rotateY(7deg);
        }
        31.5% {
          transform: translate(-3px) rotateY(-5deg);
        }
        43.5% {
          transform: translate(2px) rotateY(3deg);
        }
        50% {
          transform: translate(0px);
        }
      }
      page,
      :root {
        --nutui-color-primary: #00834d;
        --nutui-color-primary-stop-1: #00834d;
        --nutui-color-primary-stop-2: #00834d;

        --nutui-button-square-border-radius: 6px;
