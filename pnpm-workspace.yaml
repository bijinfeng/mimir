packages:
  - apps/*
  - packages/*
  # 插件包。它们是独立 workspace 包，而不是 apps/server 的子目录——
  # 「插件不 import 宿主内部」这条边界由此在**模块解析层面**成立：
  # 想 import apps/server 的东西会直接解析失败，而不是靠人记得别这么做。
  - plugins/*

patchedDependencies:
  cfb@1.2.2: patches/cfb@1.2.2.patch

# NutUI declarations import React but omit its type peer. Without this local
# extension, pnpm resolves those declarations against the workspace React 19
# types, despite the miniapp runtime and direct types being React 18.
packageExtensions:
  '@nutui/nutui-react-taro@4.0.0-beta.10':
    peerDependencies:
      '@types/react': '^18.3.0'
    peerDependenciesMeta:
      '@types/react':
        optional: true

# ── 依赖版本集中管理 ──
#
# 进 catalog 的两类东西：
#   1. 被两个以上包使用的依赖（改版本只需改一处）
#   2. 必须保持版本一致的依赖家族（结构上保证，而不是靠人记得）
#
# 第二类才是 catalog 的主要价值：@tiptap/* 有 10 个包，
# 版本错开会让 ProseMirror 的 schema 冲突，而这类错误报得很晚、很难查。
catalog:
  # ── 工具链（多包共用）──
  typescript: 7.0.2
  vitest: ^5.0.1
  '@types/node': ^26.6.2
  # 前后端共用同一个 Vite：服务端的 dev 服务器与 SSR 构建也走它。
  # 两边版本一致是结构性的要求——web 的 dev 代理与 server 的 dev 端口
  # 是一对配置，错开会得到「代理指到没人监听的端口」这类难查的症状
  vite: ^8.3.0

  # ── 共享运行库（前后端都要用同一份 schema）──
  zod: ^4.6.5

  # ── pptx 渲染（packages/office 的只读预览）──
  # UBA 双向文本算法：阿拉伯语/希伯来语与数字混排时决定字符的视觉顺序。
  # 上游 pptx-render 的唯一运行时依赖（MIT、171KB、无构建脚本）。
  # 不用浏览器的 `dir="auto"`：那个按**段落**猜方向，而幻灯片里一行之内
  # 混排是常态（「2026 Q3 · اسم المنتج」），要按 run 排。
  bidi-js: ^1.1.0

  # ── 必须版本一致的家族 ──
  # React 与 react-dom 的版本必须完全一致，否则 hooks 的调度器会错配
  react: ^19.3.0
  react-dom: ^19.3.0

  # antd 由宿主（apps/web）与编辑器包（packages/office）共用，**必须同一份**：
  # ConfigProvider 的 SizeContext / ThemeContext / cssVar 注册表都是模块级
  # 单例，出现第二份拷贝时症状是「某些控件不吃 componentSize、弹层不吃主题」，
  # 不报错。packages/office 把它声明成 peerDependency 就是为了在结构上保证
  # 只有一个实例（与 react 同一种做法）。
  # 升版本只改这里：两边的 package.json 都写 `catalog:`。
  antd: ^6.6.4

  # antd-style 与 antd 同一条理由（packages/chat 的对话面板读宿主 token）：
  # 它有自己的**模块级 cache**（es/core/CacheManager.js 与 createEmotion 实例），
  # 出现第二份拷贝时症状是「样式重复注入、顺序漂移」——不报错，只是同一处
  # 观感时对时错。packages/chat 把它声明成 peer 就是为了在结构上保证单实例。
  antd-style: ^4.1.0

  # DOM 测试环境。两个包都要用它（web 的组件测试、office 的外壳测试），
  # 且两者的 DOM 行为必须一致——否则同一段组件代码在两处得到不同结论
  happy-dom: ^20.0.0

  # Tiptap 全家必须同级：它的包共享 ProseMirror 的 schema 与插件协议
  '@tiptap/core': ^3.31.3
  '@tiptap/pm': ^3.31.3
  '@tiptap/markdown': ^3.31.3
  '@tiptap/starter-kit': ^3.31.3
  '@tiptap/extension-code-block-lowlight': ^3.31.3
  '@tiptap/extension-image': ^3.31.3
  '@tiptap/extension-bubble-menu': ^3.31.3
  '@tiptap/react': ^3.31.3
  '@tiptap/suggestion': ^3.31.3
  '@tiptap/extension-placeholder': ^3.31.3
  '@tiptap/extension-table': ^3.31.3
  '@tiptap/extension-task-item': ^3.31.3
  '@tiptap/extension-task-list': ^3.31.3
  '@tiptap/extensions': ^3.31.3

  # ── html 编辑器（D-055，vendored 自 GenOffice 的 apps/html）──
  # CodeMirror 6 家族必须**同级**：它们共享 @codemirror/state 的单例，
  # 版本错开会让两个包各自带一份 state，症状是「插件不生效」且不报错
  '@codemirror/state': ^6.5.2
  '@codemirror/view': ^6.38.6
  '@codemirror/commands': ^6.9.0
  '@codemirror/language': ^6.11.3
  '@codemirror/search': ^6.5.11
  '@codemirror/autocomplete': ^6.19.0
  '@codemirror/lang-html': ^6.4.9
  '@lezer/highlight': ^1.2.1
  # HTML 解析（parse-map 用它建「元素 ↔ 源码偏移」的映射）。
  # 选它是因为上游用同一份——两处解析器不同会让偏移对不上
  parse5: ^7.3.0

  # ── PDF（D-056）──
  # 渲染：pdfjs-dist（Apache-2.0）。用它而不是浏览器内置阅读器，是因为
  # `<iframe>` 里那个阅读器我们控制不了——没法加自己的工具条，也没法与
  # 编辑功能共存。上游用同一版本族（6.x）。
  # 体积：legacy build 的 pdf.mjs + worker 约 1MB gzip，只在打开 PDF 时加载。
  pdfjs-dist: ^6.3.289
  # 结构写入：pdf-lib（MIT）。页面级操作（旋转/删除/重排/插入）用它，
  # 纯 JS、浏览器里能跑，不需要 WASM。
  pdf-lib: ^1.17.1

# 关于 node_modules 里出现的未声明包
#
# @vitejs/plugin-react 把三个包列为 optional peer：
#   oxc-transform-react / @rolldown/plugin-babel / babel-plugin-react-compiler
# 但 react({ compiler: true }) 只动态导入 oxc-transform-react，另外两个属于
# 另一条路径（单独导出的 reactCompilerPreset，走 Babel）。
#
# 所以 package.json 里只声明 oxc-transform-react。另外两个仍然出现在
# node_modules 里，是 pnpm 的 autoInstallPeers 默认行为装的，不是我们的依赖。
# 已验证：删掉声明前后，构建产物逐字节一致。

# 构建依赖：pnpm 12 默认阻止依赖执行安装脚本，需要显式放行。
# esbuild 被 vite / drizzle-kit 使用，必须允许执行。
allowBuilds:
  esbuild: true
  '@prisma/client': false
  # SQLite 驱动（本地开发 / 桌面端后端，D-045）。v13 起在包内自带 N-API
  # 预编译（prebuilds/<platform>.node，跨 Node/Electron 通用），安装脚本
  # （node-gyp）只是无预编译平台的兜底——本机没有 node-gyp，显式拒绝。
  # 若换成无预编译的平台，再把它改回 true 并装好 node-gyp。
  better-sqlite3: false
  # Electron 的 postinstall 下载平台二进制（桌面端载体，D-046）
  electron: true
  # electron-builder 的传递依赖（做 Windows Squirrel 安装包用）。我们只打
  # macOS dmg，用不到它的脚本，显式拒绝而不是留着让 install 报错
  electron-winstaller: false
  # TypeScript 7 是 Go 重写版，各平台的原生二进制；不需要构建脚本
  '@typescript/typescript-linux-x64': false
  # Donation notice only; prebuilt worker and WASM need no install script.
  tesseract.js: false
  # Miniapp toolchain uses published native prebuilds. These scripts only
  # compile from source / provide optional WASM fallback; unsupported hosts
  # must explicitly revisit this policy rather than downloading at install time.
  '@parcel/watcher': false
  '@swc/core': false
  '@tarojs/binding': false
  # NutUI runs usage telemetry; Taro CLI attempts an unpinned external
  # performance plugin install. Neither is needed for compilation.
  '@nutui/nutui-react-taro': false
  '@tarojs/cli': false
  # Donation notices only, no generated runtime assets.
  core-js: false
  core-js-pure: false

# 新版本发布满一天后才允许安装。防止误装当天发布、可能被投毒的版本。
minimumReleaseAge: 1440
# User-approved 2026-10-16: exact official XLSX engine for typed formula
# recalculation; all other packages and versions retain the 24-hour gate.
minimumReleaseAgeExclude:
  - '@ironcalc/wasm-xlsx@0.9.0'
